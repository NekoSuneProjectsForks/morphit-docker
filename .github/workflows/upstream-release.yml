name: Morphit upstream release image

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: morphit-upstream-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/nekosuneprojectsforks/morphit

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.release.outputs.changed }}

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Find latest published Morphit release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest="$(python3 scripts/fetch-release.py --latest-tag)"
          previous=""
          if [[ -f .upstream-release ]]; then
            previous="$(tr -d '\r\n' < .upstream-release)"
          fi

          if [[ -z "$latest" ]]; then
            echo "Forgejo returned an empty release tag." >&2
            exit 1
          fi

          if [[ ${#latest} -gt 128 || "$latest" =~ [^A-Za-z0-9_.-] ]]; then
            echo "Upstream release tag is not safe to use as a Docker tag: $latest" >&2
            exit 1
          fi

          changed=false
          if [[ "$latest" != "$previous" ]]; then
            changed=true
          fi

          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          echo "Latest upstream release: $latest"
          echo "Last successfully built release: ${previous:-<none>}"
          echo "Build required: $changed"

          {
            echo "### Morphit release check"
            echo ""
            echo "- Latest upstream release: \`$latest\`"
            echo "- Last successfully built release: \`${previous:-none}\`"
            echo "- Build required: \`$changed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build AMD64 + ARM64
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Download and verify upstream release
        env:
          MORPHIT_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-release.py --tag "$MORPHIT_TAG" --output upstream
          test -f upstream/package.json
          test -f upstream/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MORPHIT_VERSION=${{ needs.check.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.check.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=morphit-release
          cache-to: type=gha,mode=max,scope=morphit-release

      - name: Build summary
        run: |
          {
            echo "### Morphit image published"
            echo ""
            echo "- Release: \`${{ needs.check.outputs.tag }}\`"
            echo "- Image: \`${IMAGE_NAME}:${{ needs.check.outputs.tag }}\`"
            echo "- Also tagged: \`${IMAGE_NAME}:latest\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  record:
    name: Record successful release
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout latest wrapper repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record release only after successful image push
        env:
          MORPHIT_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$MORPHIT_TAG" > .upstream-release
          git add .upstream-release

          if git diff --cached --quiet; then
            echo "Release marker is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record Morphit ${MORPHIT_TAG} image"
          git pull --rebase origin main
          git push origin HEAD:main
